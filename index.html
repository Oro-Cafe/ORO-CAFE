<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORO Cafe</title>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { position: relative; width: 100%; max-width: 500px; }
        img { width: 100%; display: block; }
        .btn { position: absolute; background: transparent; border: none; cursor: pointer; z-index: 10; }
        .btn-menu { top: 25%; left: 5%; width: 43%; height: 21%; }
        .btn-wedding { top: 25%; right: 5%; width: 43%; height: 21%; }
        .btn-birthday { top: 48%; left: 5%; width: 90%; height: 18%; }
        .btn-student { top: 69%; left: 5%; width: 43%; height: 14%; }
        .btn-time { top: 69%; right: 5%; width: 43%; height: 14%; }
        #modal { display: none; position: fixed; top: 10%; left: 5%; width: 90%; max-height: 80%; background: #1a1a1a; border: 2px solid #c5a059; border-radius: 20px; color: #fff; padding: 20px; z-index: 100; overflow-y: auto; }
        .close-btn { color: #c5a059; float: left; cursor: pointer; font-size: 24px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://oro-cafe.github.io/ORO-CAFE/welcome-bg.jpg.png" alt="ORO Cafe">
        
        <button class="btn btn-menu" onclick="show('menu')"></button>
        <button class="btn btn-wedding" onclick="show('wedding')"></button>
        <button class="btn btn-birthday" onclick="show('birthday')"></button>
        <button class="btn btn-student" onclick="show('student')"></button>
        <button class="btn btn-time" onclick="show('time')"></button>
    </div>

    <div id="modal">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 id="modal-title" style="color:#c5a059; text-align:center;"></h2>
        <div id="modal-content"></div>
    </div>

    <script>
        function show(type) {
            const data = {
                'menu': { title: "المنيو", content: "• قهوة تركي: 25 ج<br>• اسبريسو: 35 ج<br>• كابتشينو: 50 ج<br>• لاتيه: 55 ج" },
                'wedding': { title: "عروض الخطوبة", content: "• باكدج يبدأ من 3499 ج.<br>• شامل القاعة والساوند والديكور." },
                'birthday': { title: "أعياد الميلاد", content: "• خصومات خاصة للمجموعات تبدأ من 100 ج." },
                'student': { title: "باكدج الطلاب", content: "• عروض مميزة للطلاب بخصومات تصل لـ 15%." },
                'time': { title: "مواعيد العمل", content: "• من 8 صباحاً حتى 1:30 بعد منتصف الليل." }
            };
            document.getElementById('modal-title').innerText = data[type].title;
            document.getElementById('modal-content').innerHTML = data[type].content;
            document.getElementById('modal').style.display = 'block';
        }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
    </script>
</body>
</html>
