<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORO Cafe - Official</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d0d0d; color: #fff; direction: rtl; text-align: center; }
        .main-wrapper { max-width: 500px; margin: 0 auto; min-height: 100vh; background-color: #000; position: relative; padding-bottom: 40px; }
        .bg-container { position: relative; width: 100%; height: 100vh; background: url('welcome-bg.jpg.png') no-repeat center top; background-size: contain; }
        .btn { position: absolute; background: rgba(255, 255, 255, 0); cursor: pointer; border: none; z-index: 10; }
        .menu-btn { top: 21%; left: 5%; width: 42%; height: 21%; }
        .wedding-btn { top: 21%; right: 5%; width: 42%; height: 21%; }
        .birthday-btn { top: 44%; left: 5%; width: 90%; height: 17%; }
        .student-btn { top: 63%; left: 5%; width: 42%; height: 21%; }
        .hours-btn { top: 63%; right: 5%; width: 42%; height: 21%; }

        /* شريط التواصل الفخم */
        .social-bar { display: flex; justify-content: center; gap: 30px; padding: 25px 0; margin: 10px 20px; border-top: 1px solid #c5a059; border-bottom: 1px solid #c5a059; background: #000; }
        .social-icon { color: #c5a059; font-size: 30px; transition: 0.3s; text-decoration: none; }
        .social-icon:hover { color: #fff; transform: scale(1.2); }

        .details-panel { margin: 20px; padding: 25px; background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%); border: 2px solid #c5a059; border-radius: 15px; display: none; text-align: right; }
        .details-panel h2 { color: #c5a059; font-size: 22px; margin-bottom: 15px; border-bottom: 1px solid #c5a059; padding-bottom: 10px; text-align: center; }
        .details-panel p { color: #e6e6e6; font-size: 15px; line-height: 1.8; margin: 8px 0; }
        .highlight-gold { color: #c5a059; font-weight: bold; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="bg-container">
        <a href="https://oro-cafe.github.io/ORO-CAFE/" class="btn menu-btn"></a>
        <button class="btn wedding-btn" onclick="showDetails('wedding')"></button>
        <button class="btn birthday-btn" onclick="showDetails('birthday')"></button>
        <button class="btn student-btn" onclick="showDetails('student')"></button>
        <button class="btn hours-btn" onclick="showDetails('hours')"></button>
    </div>

    <div class="social-bar">
        <a href="https://wa.me/201098896637" class="social-icon" target="_blank"><i class="fab fa-whatsapp"></i></a>
        <a href="https://www.facebook.com/share/19B3yYkAmw/" class="social-icon" target="_blank"><i class="fab fa-facebook"></i></a>
        <a href="https://www.tiktok.com/@orocafe01" class="social-icon" target="_blank"><i class="fab fa-tiktok"></i></a>
        <a href="https://www.instagram.com/oro_cafee01" class="social-icon" target="_blank"><i class="fab fa-instagram"></i></a>
    </div>

    <div id="detailsPanel" class="details-panel">
        <h2 id="panelTitle"></h2>
        <div id="panelContent"></div>
    </div>
</div>

<script>
    const data = {
        hours: { title: "✨ مواعيد ORO Cafe ✨", content: `<p>من 8 صباحاً لـ 1:30 بعد منتصف الليل.<br>الجمعة: من 12 ظهراً لـ 1:30 بعد منتصف الليل.</p>` },
        student: { title: "✨ باكدج الطلاب ✨", content: `<p>ساعة مذاكرة بـ 20 ج، ساعتين بـ 35 ج، وخصم 15% على المشروبات. الرابع دايماً هدية! 🤭</p>` },
        birthday: { title: "✨ أعياد الميلاد والسبوع ✨", content: `<p>أسعار تبدأ من 800 ج لـ 3400 ج حسب العدد. شامل الساوند سيستم والمكان بالكامل.</p>` },
        wedding: { title: "⭐ الخطوبة وكتب الكتاب ⭐", content: `<p>عرض خاص 3450 ج (بدل 7500 ج). قاعة مكيفة تسع 80 فرد شاملة الساوند سيستم.</p>` }
    };

    function showDetails(key) {
        document.getElementById('detailsPanel').style.display = 'block';
        document.getElementById('panelTitle').innerHTML = data[key].title;
        document.getElementById('panelContent').innerHTML = data[key].content;
        document.getElementById('detailsPanel').scrollIntoView({ behavior: 'smooth' });
    }
</script>
</body>
</html>
