<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORO Cafe</title>
    <style>
        body { margin: 0; background: #000; text-align: center; font-family: sans-serif; }
        .wrapper { position: relative; width: 100%; max-width: 500px; margin: auto; }
        .main-img { width: 100%; display: block; }
        .click-area { position: absolute; cursor: pointer; z-index: 100; }
        
        #content-area { display: none; background: #d4af37; min-height: 100vh; padding: 25px; color: #000; }
        .back-btn { margin-top: 30px; padding: 15px 40px; background: #000; color: #d4af37; border: none; border-radius: 10px; cursor: pointer; font-size: 18px; }
    </style>
</head>
<body>

<div id="main-wrapper" class="wrapper">
    <img src="cafe.jpg.png" alt="ORO Cafe" class="main-img">
    <a href="https://oro-cafe.github.io/ORO-Caf-/" target="_blank" class="click-area" style="top: 22%; left: 10%; width: 35%; height: 12%;"></a>
    <div onclick="showContent('engagement')" class="click-area" style="top: 22%; left: 55%; width: 35%; height: 12%;"></div>
    <div onclick="showContent('birthday')" class="click-area" style="top: 40%; left: 10%; width: 80%; height: 12%;"></div>
    <div onclick="showContent('students')" class="click-area" style="top: 60%; left: 10%; width: 35%; height: 12%;"></div>
    <div onclick="showContent('times')" class="click-area" style="top: 60%; left: 55%; width: 35%; height: 12%;"></div>

    <a href="https://www.facebook.com/share/18qc1vY1iN/" target="_blank" class="click-area" style="top: 89%; left: 24%; width: 9%; height: 7%;"></a>
    <a href="https://www.instagram.com/oro_cafee01" target="_blank" class="click-area" style="top: 89%; left: 38%; width: 9%; height: 7%;"></a>
    <a href="https://www.tiktok.com/@orocafe01" target="_blank" class="click-area" style="top: 89%; left: 52%; width: 9%; height: 7%;"></a>
</div>

<div id="content-area">
    <h2 id="title"></h2>
    <p id="body" style="font-size: 18px; line-height: 1.8; white-space: pre-line; text-align: right;"></p>
    <button class="back-btn" onclick="back()">رجوع للرئيسية</button>
</div>

<script>
    const data = {
        engagement: { 
            title: "عروض الخطوبة وكتب الكتاب", 
            body: "عروض لفترة محدودة 💛\n\n• العرض الأول (3499ج): قاعة مكيفة + ساوند سيستم (بدون ديكور).\n• العرض الثاني (5500ج): قاعة مكيفة + ساوند + ديكور وكوشة.\n• العرض الفضي (6900ج): قاعة + ساوند + ديكور + كوشة + 70 كانز.\n• العرض الذهبي (7880ج): قاعة + ساوند + ديكور + كوشة + 70 علبة ضيافة (جاتوه، باتيه، شيكولاتة).\n• عرض VIP (9280ج): قاعة + ساوند + ديكور + كوشة + 70 علبة جاتوه و 70 كانز.\n\n✨ معلومات هامة:\n- القاعة بالدور الثاني (مكيفة بالكامل)، تسع متوسط 80 فرد.\n- متاح فوتوسيشن في الحديقة مجاناً لفترة محدودة.\n- رسوم سيرفس بسيطة (499ج) في حالة الطلب من الخارج." 
        },
        birthday: { 
            title: "عروض أعياد الميلاد والسبوع", 
            body: "أهلاً بحضرتك يافندم 💛\nمتاح مكانين تختار منهم: (الدور الثاني أو الحديقة).\n\n✍️ العروض:\n• أقل من 5 أفراد: 100ج + طلب من المنيو.\n• من 5 لـ 10 أفراد: 200ج + طلب من المنيو.\n• من 10 لـ 20 فرد: 350ج + طلب من المنيو.\n• 20 فرد فأكثر: 50ج للفرد (بدون شرط الطلب) + خصم 10% لو طلبتوا.\n\nالسعر شامل المكان والساوند سيستم فقط.\n✨ خدمات اختيارية:\n• متاح تجهيز ديكور خارجي أو التجهيز بنفسك." 
        },
        students: { 
            title: "باكدج الطلاب والمذاكرة", 
            body: "أهلاً بحضرتك يافندم 💛\n\n• ساعة مذاكرة بـ 20ج.\n• ساعتين بـ 35ج.\n• أو خصم 15% على منيو المشروبات الباردة والديزرت.\n\nولو جاي مع صحابك... الرابع علينا هدية! 🎁\nفي انتظاركم ✨💛" 
        },
        times: { 
            title: "مواعيد العمل", 
            body: "• يومياً: من 8 صباحاً إلى 1:30 بعد منتصف الليل.\n• الجمعة: من 12 ظهراً إلى 1:30 بعد منتصف الليل." 
        }
    };

    function showContent(id) {
        document.getElementById('main-wrapper').style.display = 'none';
        document.getElementById('content-area').style.display = 'block';
        document.getElementById('title').innerText = data[id].title;
        document.getElementById('body').innerText = data[id].body;
    }

    function back() {
        document.getElementById('main-wrapper').style.display = 'block';
        document.getElementById('content-area').style.display = 'none';
    }
</script>

</body>
</html>
