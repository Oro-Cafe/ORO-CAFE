<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORO Cafe</title>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background-color: #000; color: #fff; text-align: center; }
        .wrapper { max-width: 500px; margin: 0 auto; position: relative; }
        img { width: 100%; display: block; }
        .btn { position: absolute; background: transparent; border: none; cursor: pointer; z-index: 10; }
        
        /* إحداثيات الأزرار (مكانها على الصورة) */
        .location-btn { top: 62%; left: 10%; width: 80%; height: 8%; }
        .menu-btn { top: 72%; left: 10%; width: 80%; height: 8%; }
        /* لو عندك أزرار تانية للعروض، ضيفيهم هنا بنفس التنسيق */

        #details { 
            margin: 20px; padding: 25px; background: #1a1a1a; 
            border: 2px solid #c5a059; border-radius: 15px; 
            text-align: right; display: none; line-height: 2; font-size: 18px;
        }
        h2 { color: #c5a059; text-align: center; }
        b { color: #c5a059; }
    </style>
</head>
<body>
    <div class="wrapper">
        <img src="welcome-bg.jpg.png" alt="ORO Cafe">
        
        <a href="حطي_رابط_الماب_هنا" class="btn location-btn"></a>
        
        <button class="btn menu-btn" onclick="show('menu')"></button>
    </div>
    
    <div id="details">
        <h2 id="title"></h2>
        <div id="content"></div>
    </div>

    <script>
        function show(type) {
            const d = document.getElementById('details');
            const t = document.getElementById('title');
            const c = document.getElementById('content');
            d.style.display = 'block';
            
            if(type === 'menu') {
                t.innerText = "📜 المنيو والعروض 📜";
                c.innerHTML = "• <b>عروض الخطوبة:</b> تبدأ من 3499 ج.<br>• <b>أعياد الميلاد:</b> باكدجات تبدأ من 100 ج.<br>• <b>المشروبات:</b> تشكيلة واسعة من القهوة والمشروبات الباردة.<br>• <b>مواعيد العمل:</b> 8 صباحاً حتى 1 صباحاً.";
            }
            d.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
