<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ORO CAFE</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  text-align: center;
}

/* الصورة */
img {
  width: 100%;
  max-width: 500px;
  display: block;
  margin: auto;
}

/* الأقسام */
.section {
  display: none;
  padding: 20px;
  max-width: 500px;
  margin: auto;
}

.active {
  display: block;
}

/* زر الإغلاق */
.close-btn {
  margin-top: 15px;
  padding: 10px 20px;
  background: crimson;
  border: none;
  color: white;
  cursor: pointer;
  border-radius: 8px;
}

/* تحسين بسيط */
h2 {
  color: gold;
}
</style>
</head>

<body>

<!-- 🔥 الصورة الأساسية -->
<img src="cafe.jpg.png" usemap="#oromap" alt="ORO CAFE">

<!-- 🔥 أماكن الضغط داخل الصورة -->
<map name="oromap">

  <!-- About -->
  <area shape="rect" coords="40,120,460,220"
        href="javascript:void(0)"
        onclick="show('about')">

  <!-- Menu -->
  <area shape="rect" coords="40,240,460,340"
        href="javascript:void(0)"
        onclick="show('menu')">

  <!-- Contact -->
  <area shape="rect" coords="40,360,460,460"
        href="javascript:void(0)"
        onclick="show('contact')">

  <!-- Working Hours -->
  <area shape="rect" coords="40,480,460,580"
        href="javascript:void(0)"
        onclick="show('hours')">

</map>

<!-- 🔥 المحتوى -->

<div id="about" class="section">
  <h2>About ORO CAFE</h2>
  <p>Welcome to ORO Cafe 💛✨  
  Cozy place, best coffee & desserts ☕🍰</p>
  <button class="close-btn" onclick="closeAll()">Close</button>
</div>

<div id="menu" class="section">
  <h2>Menu</h2>
  <p>
    Espresso ☕<br>
    Latte ☕<br>
    Cappuccino ☕<br>
    Cold Drinks 🧊<br>
    Desserts 🍰
  </p>
  <button class="close-btn" onclick="closeAll()">Close</button>
</div>

<div id="contact" class="section">
  <h2>Contact Us</h2>
  <p>
    📍 Visit us at ORO Cafe<br>
    📩 Message us on Facebook page<br>
    📞 Available for reservations
  </p>
  <button class="close-btn" onclick="closeAll()">Close</button>
</div>

<div id="hours" class="section">
  <h2>Working Hours</h2>
  <p>
    Open daily:<br>
    🕗 8:00 AM<br>
    🌙 1:30 AM
  </p>
  <button class="close-btn" onclick="closeAll()">Close</button>
</div>

<!-- 🔥 التحكم -->
<script>
function show(id) {
  let sections = document.querySelectorAll(".section");

  sections.forEach(sec => {
    sec.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");

  // ينزل لتحت تلقائي
  document.getElementById(id).scrollIntoView({behavior:"smooth"});
}

function closeAll() {
  document.querySelectorAll(".section")
    .forEach(sec => sec.classList.remove("active"));
}
</script>

</body>
</html>
