<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORO Cafe</title>
    <style>
        body { margin: 0; background: #000; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; }
        .container { position: relative; width: 100%; max-width: 500px; }
        img { width: 100%; height: auto; display: block; }
        .btn { position: absolute; background: transparent; border: none; cursor: pointer; }
        
        .btn-menu { top: 25%; left: 5%; width: 43%; height: 21%; }
        .btn-wedding { top: 25%; right: 5%; width: 43%; height: 21%; }
        .btn-birthday { top: 48%; left: 5%; width: 90%; height: 18%; }
        .btn-student { top: 69%; left: 5%; width: 43%; height: 14%; }
        .btn-time { top: 69%; right: 5%; width: 43%; height: 14%; }
        
        #display-area { width: 100%; max-width: 500px; background: #1a1a1a; color: #fff; padding: 20px; border-top: 2px solid #c5a059; text-align: center; line-height: 1.6; box-sizing: border-box; }
        h2 { color: #c5a059; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <img src="cafe.jpg.png" alt="ORO Cafe">
        <button class="btn btn-menu" onclick="showContent('menu')"></button>
        <button class="btn btn-wedding" onclick="showContent('wedding')"></button>
        <button class="btn btn-birthday" onclick="showContent('birthday')"></button>
        <button class="btn btn-student" onclick="showContent('student')"></button>
        <button class="btn btn-time" onclick="showContent('time')"></button>
    </div>

    <div id="display-area">
        <h2 id="title">مرحباً بكم في ORO Cafe</h2>
        <div id="content">اضغطي على أي زرار في الصورة لعرض التفاصيل 💛</div>
    </div>

    <script>
        function showContent(type) {
            if (type === 'menu') {
                window.open('https://oro-cafe.github.io/ORO-Caf-/', '_blank');
                return;
            }
            
            const data = {
                'wedding': { 
                    title: "عروض الخطوبة وكتب الكتاب", 
                    content: "<b>العرض الأول:</b> 3499 ج (قاعة + ساوند).<br><b>العرض الثاني:</b> 5500 ج (قاعة + ساوند + ديكور).<br><b>العرض الفضي:</b> 6900 ج.<br><b>العرض الذهبي:</b> 7880 ج.<br><b>عرض VIP:</b> 9280 ج.<br><small>*القاعة تسع 80 فرد ومكيفة بالكامل.</small>" 
                },
                'birthday': { 
                    title: "عروض أعياد الميلاد والسبوع", 
                    content: "أهلاً بحضرتك يافندم 💛<br>عروض أعياد الميلاد والسبوع ، متاح مكانين تختار منهم 🔥 :<br>١. المكان بالدور الثاني<br>٢. الحديقه الموجودة امام الكافية<br><br><b>✍️ العرض الاول (شامل المكانين):</b><br>• اقل من 5 أفراد (كانز أو مشروب ساخن): 200 جنية.<br>• عند الطلب من منيو المشروبات البارده أو الديزرت: 100 جنية.<br>• عند عدم وجود تورته وطلب ديزرت ويكتب Happy birthday: لا توجد رسوم خدمه ولكن يجب الطلب من منيو المشروبات البارده أو الديزرت لباقي الأفراد.<br><br><b>✍️ العرض الثاني (من 5 إلى 10 أفراد):</b> 300 جنية بالإضافة إلي الطلب من منيو المشروبات والديزرت ✨💛<br><br><b>✍️ العرض الثالث (من 10 لـ 20 فرد - شامل المكانين):</b> 450 جنية بالإضافة إلى الطلب من منيو المشروبات والديزرت.<br><br><b>✍️ العرض الرابع (20 فرد فأكثر - حجز الدور الثاني):</b> يحسب الفرد بـ 50 جنية 🔥 (لا يشترط الطلب من المنيو، وعند الطلب من المشروبات الباردة أو الديزرت يوجد خصم 10% على الفاتورة 🎁).<br><br><small>*السعر شامل المكان والساوند سيستم فقط لا يشمل الديكور.<br>• متاح جلب متخصصين للديكور أو تنفيذه بأنفسكم ✨</small>" 
                },
                'student': { 
                    title: "باكدج الطلاب والمذاكرة", 
                    content: "• ساعة مذاكرة بـ 20 ج.<br>• ساعتين بـ 35 ج.<br>• خصم 15% على المشروبات والديزرت.<br>• ولو جاي مع صحابك.. الرابع علينا هدية! 🤭" 
                },
                'time': { 
                    title: "مواعيد العمل", 
                    content: "• من 8 صباحاً حتى 1:30 بعد منتصف الليل.<br>• يوم الجمعة: من 12 ظهراً حتى 1:30 بعد منتصف الليل." 
                }
            };

            if (data[type]) {
                document.getElementById('title').innerText = data[type].title;
                document.getElementById('content').innerHTML = data[type].content;
            }
        }
    </script>
</body>
</html>
