<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORO Cafe - اللمة الحلوة</title>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background-color: #000; color: #fff; text-align: center; }
        .wrapper { max-width: 500px; margin: 0 auto; position: relative; }
        img { width: 100%; display: block; }
        .btn { position: absolute; background: transparent; border: none; cursor: pointer; z-index: 10; }
        /* أماكن الأزرار بناءً على تصميمك */
        .menu-btn { top: 78%; left: 10%; width: 80%; height: 8%; } 
        .location-btn { top: 65%; left: 10%; width: 80%; height: 8%; }
        
        #details { 
            margin: 20px; padding: 25px; background: #1a1a1a; 
            border: 2px solid #c5a059; border-radius: 15px; 
            text-align: right; display: none; line-height: 1.8; font-size: 16px;
        }
        h2 { color: #c5a059; text-align: center; }
        b { color: #c5a059; }
    </style>
</head>
<body>
    <div class="wrapper">
        <img src="welcome-bg.jpg.png" alt="ORO Cafe">
        
        <a href="https://maps.app.goo.gl/رابط_مكانك_هنا" class="btn location-btn"></a>
        
        <a href="https://oro-cafe.github.io/ORO-Caf-/" class="btn menu-btn"></a>
    </div>
    
    <div id="details">
        <h2 id="title"></h2>
        <div id="content"></div>
    </div>

    <script>
        // كود بسيط لفتح أي روابط إضافية إذا احتجتِ مستقبلاً

</html>
