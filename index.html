<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORO Cafe</title>
    <style>
        body { margin: 0; background: #000; font-family: sans-serif; display: flex; justify-content: center; }
        .wrapper { position: relative; width: 100%; max-width: 500px; }
        .main-img { width: 100%; display: block; }
        
        /* الأزرار مخفية تماماً فوق الصورة */
        .btn-link { position: absolute; cursor: pointer; opacity: 0; z-index: 10; }
        
        /* تصميم النافذة المنبثقة */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #d4af37; color: #000; padding: 20px; border-radius: 15px; width: 80%; max-height: 80%; overflow-y: auto; text-align: center; }
        .close-btn { margin-top: 15px; padding: 10px 20px; background: #000; color: #d4af37; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="wrapper">
    <img src="cafe.jpg.png" alt="ORO Cafe" class="main-img">
    
    <a onclick="openModal('menu')" class="btn-link" style="top: 22%; left: 10%; width: 35%; height: 12%;"></a>
    <a onclick="openModal('engagement')" class="btn-link" style="top: 22%; left: 55%; width: 35%; height: 12%;"></a>
    <a onclick="openModal('birthday')" class="btn-link" style="top: 38%; left: 10%; width: 80%; height: 12%;"></a>
    <a onclick="openModal('students')" class="btn-link" style="top: 58%; left: 10%; width: 35%; height: 12%;"></a>
    <a onclick="openModal('times')" class="btn-link" style="top: 58%; left: 55%; width: 35%; height: 12%;"></a>
</div>

<div id="modal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h2 id="modal-title"></h2>
        <p id="modal-body" style="white-space: pre-line; line-height: 1.6;"></p>
        <button class="close-btn" onclick="closeModal()">إغلاق</button>
    </div>
</div>

<script>
    const data = {
        menu: { title: "المنيو والأسعار", body: "تفضلوا بزيارة المنيو الخاص بنا:\nhttps://oro-cafe.github.io/ORO-Caf-/" },
        engagement: { title: "عروض الخطوبة", body: "• العرض الأول (3499ج): قاعة مكيفة + ساوند سيستم.\n• العرض الثاني (5500ج): قاعة + ساوند + ديكور + كوشة.\n• العرض الفضي (6900ج): باكدج كامل + 70 كانز.\n• العرض الذهبي (7880ج): باكدج كامل + 70 علبة ضيافة.\n• عرض الـ VIP (9280ج): باكدج كامل + 70 جاتوه و70 كانز.\n\nمتاح فوتوسيشن في الحديقة لفترة محدودة!" },
        birthday: { title: "أعياد الميلاد والسبوع", body: "• أقل من 5 أفراد: 100ج.\n• 5 - 10 أفراد: 200ج.\n• 10 - 20 فرد: 350ج.\n• أكثر من 20 فرد: 50ج للفرد (مع خصم 10% على الطلبات).\n\nالسعر شامل المكان والساوند سيستم فقط." },
        students: { title: "باكدج الطلاب والمذاكرة", body: "• ساعة: 20ج | ساعتين: 35ج.\n• خصم 15% على المشروبات والديزرت.\n• ولو جاي مع صحابك... الرابع علينا هدية!" },
        times: { title: "مواعيدنا", body: "• يومياً: من 8 صباحاً إلى 1:30 بعد منتصف الليل.\n• الجمعة: من 12 ظهراً إلى 1:30 بعد منتصف الليل." }
    };

    function openModal(id) {
        document.getElementById('modal-title').innerText = data[id].title;
        document.getElementById('modal-body').innerText = data[id].body;
        document.getElementById('modal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }
</script>

</body>
</html>
