<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Oro Cafe</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background-color: #000; color: #fff; direction: rtl; text-align: center; }
        .main-wrapper { max-width: 500px; margin: 0 auto; min-height: 100vh; background-color: #000; padding-bottom: 40px; }
        .bg-container { position: relative; width: 100%; height: 100vh; background: url('welcome-bg.jpg.png') no-repeat center top; background-size: contain; }
        .btn { position: absolute; background: rgba(0,0,0,0); cursor: pointer; border: none; z-index: 10; }
        .menu-btn { top: 21%; left: 5%; width: 42%; height: 21%; }
        .wedding-btn { top: 21%; right: 5%; width: 42%; height: 21%; }
        .birthday-btn { top: 44%; left: 5%; width: 90%; height: 17%; }
        .social-links { display: flex; justify-content: center; gap: 20px; padding: 20px 0; }
        .details-panel { margin: 20px; padding: 20px; background: #1a1a1a; border: 2px solid #c5a059; border-radius: 15px; display: none; text-align: right; }
        h2 { color: #c5a059; text-align: center; }
        p, li { line-height: 1.6; font-size: 15px; }
    </style>
</head>
<body>
<div class="main-wrapper">
    <div class="bg-container">
        <a href="https://oro-cafe.github.io/ORO-Caf-/" class="btn menu-btn"></a>
        <button class="btn wedding-btn" onclick="show('wedding')"></button>
        <button class="btn birthday-btn" onclick="show('birthday')"></button>
    </div>
    <div id="panel" class="details-panel">
        <h2 id="title"></h2>
        <div id="content"></div>
    </div>
</div>
<script>
    const data = {
        birthday: {
            title: "✨ أعياد الميلاد والسبوع ✨",
            content: "متاح حجز (الدور الثاني) أو (الحديقة) 🔥<br><br><b>• أقل من 5 أفراد:</b> 100 ج خدمة + طلب من المنيو.<br><b>• 5 لـ 10 أفراد:</b> 200 ج خدمة + طلب من المنيو.<br><b>• 10 لـ 20 فرد:</b> 350 ج خدمة + طلب من المنيو.<br><b>• 20 فرد فأكثر:</b> 50 ج للفرد (لا يشترط الطلب) + خصم 10% على المنيو.<br><br>✔️ السعر شامل المكان والساوند سيستم.<br>✨ ديكور متاح عند الطلب."
        },
        wedding: {
            title: "⭐ عروض الخطوبة وكتب الكتاب ⭐",
            content: "القاعة مكيفة بالكامل (الدور الثاني) - تسع 80 فرد.<br><br>• <b>العرض الأول:</b> 3499 ج (مكان + ساوند).<br>• <b>العرض الثاني:</b> 5500 ج (مكان + ساوند + ديكور وكوشة).<br>• <b>العرض الفضي:</b> 6900 ج (العرض الثاني + 70 علبة كانز).<br>• <b>العرض الذهبي:</b> 7880 ج (العرض الثاني + 70 علبة جاتوه مشكل).<br>• <b>عرض الـ VIP:</b> 9280 ج (العرض الثاني + 70 جاتوه + 70 كانز).<br><br>🎁 عرض لفترة محدودة: فوتوسيشن مجاني في الحديقة.<br>💡 رسوم سيرفس (في حال التقديم فقط): 499 ج."
        }
    };
    function show(key) {
        document.getElementById('title').innerHTML = data[key].title;
        document.getElementById('content').innerHTML = data[key].content;
        document.getElementById('panel').style.display = 'block';
        document.getElementById('panel').scrollIntoView({ behavior: 'smooth' });
    }
</script>
</body>
</html>
