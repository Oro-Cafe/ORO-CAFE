<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ORO Cafe</title>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; text-align: center; }
        .btn-container { margin: 20px; }
        button { background: #c5a059; color: #000; padding: 15px 30px; margin: 10px; border: none; cursor: pointer; font-size: 18px; font-weight: bold; border-radius: 10px; }
        #display { margin-top: 20px; padding: 20px; background: #222; border: 1px solid #c5a059; }
    </style>
</head>
<body>
    <h1>مرحباً بكم في ORO Cafe</h1>
    <div class="btn-container">
        <button onclick="show('birthday')">عروض أعياد الميلاد</button>
        <button onclick="show('wedding')">عروض الخطوبة</button>
    </div>
    <div id="display">اضغط على أحد العروض لعرض التفاصيل</div>

    <script>
        function show(type) {
            const display = document.getElementById('display');
            if(type === 'birthday') {
                display.innerHTML = "<h2>عروض أعياد الميلاد</h2><p>• أقل من 5 أفراد: 100 ج.<br>• من 5 لـ 10 أفراد: 200 ج.<br>• من 10 لـ 20 فرد: 350 ج.<br>• 20 فأكثر: 50 ج للفرد.</p>";
            } else {
                display.innerHTML = "<h2>عروض الخطوبة</h2><p>• العرض الأول: 3499 ج.<br>• العرض الثاني: 5500 ج.<br>• العرض الفضي: 6900 ج.<br>• العرض الذهبي: 7880 ج.<br>• عرض الـ VIP: 9280 ج.</p>";
            }
        }
    </script>
</body>
</html>
