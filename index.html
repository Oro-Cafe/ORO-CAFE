<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oro Cafe</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body, html { margin: 0; padding: 0; font-family: sans-serif; background-color: #000; color: #fff; direction: rtl; text-align: center; }
        .main-wrapper { max-width: 500px; margin: 0 auto; min-height: 100vh; background-color: #000; position: relative; padding-bottom: 40px; }
        .bg-container { position: relative; width: 100%; height: 100vh; background: url('welcome-bg.jpg.png') no-repeat center top; background-size: contain; }
        .btn { position: absolute; background: rgba(255, 255, 255, 0); cursor: pointer; border: none; z-index: 10; }
        .menu-btn { top: 21%; left: 5%; width: 42%; height: 21%; }
        .wedding-btn { top: 21%; right: 5%; width: 42%; height: 21%; }
        .birthday-btn { top: 44%; left: 5%; width: 90%; height: 17%; }
        .student-btn { top: 63%; left: 5%; width: 42%; height: 21%; }
        .hours-btn { top: 63%; right: 5%; width: 42%; height: 21%; }
        .social-links { display: flex; justify-content: center; gap: 25px; padding: 20px 0; }
        .social-links a { color: #c5a059; font-size: 30px; text-decoration: none; }
        
        /* تعديل جوهري هنا: شلنا أي تحديد للارتفاع عشان النص يظهر كله */
        .details-panel { 
            margin: 20px; 
            padding: 25px; 
            background: #1a1a1a; 
            border: 2px solid #c5a059; 
            border-radius: 15px; 
            display: none; 
            text-align: right; 
            min-height: auto;
        }
        .details-panel h2 { color: #c5a059; font-size: 22px; margin-top: 0; border-bottom: 1px solid #c5a059; padding-bottom: 10px; text-align: center; }
        .details-panel p { color: #fff; font-size: 16px; line-height: 1.8; margin: 10px 0; }
        .details-panel ul { padding-right: 20px; margin: 10px 0; }
        .details-panel li { color: #fff; font-size: 16px; margin-bottom: 8px; }
        .highlight-gold { color: #c5a059; font-weight: bold; }
        .highlight-red { color: #ff4d4d; font-weight: bold; }
    </style>
</head>
<body>
<div class="main-wrapper">
    <div class="bg-container">
        <a href="https://oro-cafe.github.io/ORO-Caf-/" class="btn menu-btn" target="_blank"></a>
        <button class="btn wedding-btn" onclick="showDetails('wedding')"></button>
        <button class="btn birthday-btn" onclick="showDetails('birthday')"></button>
        <button class="btn student-btn" onclick="showDetails('student')"></button>
        <button class="btn hours-btn" onclick="showDetails('hours')"></button>
    </div>
    <div class="social-links">
        <a href="https://wa.me/201098896637" target="_blank"><i class="fab fa-whatsapp"></i></a>
        <a href="https://www.facebook.com/share/19B3yYkAmw/" target="_blank"><i class="fab fa-facebook"></i></a>
        <a href="https://www.tiktok.com/@orocafe01" target="_blank"><i class="fab fa-tiktok"></i></a>
        <a href="https://www.instagram.com/oro_cafee01" target="_blank"><i class="fab fa-instagram"></i></a>
    </div>
    <div id="detailsPanel" class="details-panel">
        <h2 id="panelTitle"></h2>
        <div id="panelContent"></div>
    </div>
</div>
<script>
    const data = {
        hours: { title: "مواعيد ORO Cafe", content: `<p>أهلاً بحضرتك يا فندم</p><p>📍 <span class="highlight-gold">طوال أيام الأسبوع:</span> من 8 صباحًا إلى 1:30 بعد منتصف الليل.</p><p>📍 <span class="highlight-gold">يوم الجمعة:</span> من 12 ظهرًا إلى 1:30 بعد منتصف الليل.</p>` },
        student: { title: "باكدج الطلاب والمذاكرة", content: `<p>عروض الطلاب والمذاكرة في Oro Cafe:</p><p>🔥 ساعة مذاكرة بـ 20 جنيه.</p><p>🔥 ساعتين مذاكرة بـ 35 جنيه.</p><p>🔥 خصم 15% على المشروبات الباردة والديزرت.</p><p>🔥 الرابع علينا هدية.</p>` },
        birthday: { title: "باكدج أعياد الميلاد والسبوع", content: `<p>أسعار حجز الحفلات:</p><ul><li>حجز ترابيزة لـ 3 أفراد: بدون رسوم عند طلب ديزرت أو مشروبات (بدون طلب: 300 جنيه).</li><li>أقل من 10 أفراد: 800 جنيه.</li><li>من 10 لـ 20 فرد: 1500 جنيه.</li><li>من 20 لـ 40 فرد: 2800 جنيه.</li><li>من 40 لـ 80 فرد: 3400 جنيه.</li></ul><p>السعر شامل الساوند سيستم.</p>` },
        wedding: { title: "باكدج الخطوبة وكتب الكتاب", content: `<p>عرض الخطوبة وكتب الكتاب:</p><p>🔥 السعر: 3450 جنيه بدلاً من <span class="highlight-red">7500 جنيه</span>.</p><p>المميزات: حجز المكان بالكامل، ساوند سيستم، قاعة مكيفة (تسع 80 فردًا).</p><p>خدمات إضافية: ديكور، ومشروبات بأسعار خاصة.</p>` }
    };
    function showDetails(key) {
        const panel = document.getElementById('detailsPanel');
        document.getElementById('panelTitle').innerHTML = data[key].title;
        document.getElementById('panelContent').innerHTML = data[key].content;
        panel.style.display = 'block';
        panel.scrollIntoView({ behavior: 'smooth' });
    }
</script>
</body>
</html>
