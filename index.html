<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ORO CAFE</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: #fff;
}

/* الصورة الرئيسية */
.hero {
  position: relative;
  width: 100%;
  max-width: 500px;
  margin: auto;
}

.hero img {
  width: 100%;
  display: block;
}

/* أزرار فوق الصورة */
.btn {
  position: absolute;
  width: 80%;
  left: 10%;
  padding: 12px;
  background: rgba(0,0,0,0.6);
  color: white;
  text-align: center;
  border: 1px solid #fff;
  cursor: pointer;
  border-radius: 10px;
}

.btn:hover {
  background: gold;
  color: black;
}

.btn.about { top: 20%; }
.btn.menu { top: 35%; }
.btn.contact { top: 50%; }
.btn.hours { top: 65%; }

/* الأقسام */
.section {
  display: none;
  padding: 20px;
  text-align: center;
}

.active {
  display: block;
}

.close {
  margin-top: 20px;
  padding: 10px 20px;
  background: crimson;
  border: none;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- الصورة + الأزرار -->
<div class="hero">

  <img src="cafe.jpg.png" alt="ORO CAFE">

  <div class="btn about" onclick="show('about')">About Us</div>
  <div class="btn menu" onclick="show('menu')">Menu</div>
  <div class="btn contact" onclick="show('contact')">Contact</div>
  <div class="btn hours" onclick="show('hours')">Working Hours</div>

</div>

<!-- الأقسام -->

<div id="about" class="section">
  <h2>About ORO CAFE</h2>
  <p>Welcome to ORO Cafe - cozy place, best coffee & desserts ☕🍰</p>
  <button class="close" onclick="closeAll()">Close</button>
</div>

<div id="menu" class="section">
  <h2>Our Menu</h2>
  <p>Coffee - Espresso - Latte - Desserts - Cold Drinks</p>
  <button class="close" onclick="closeAll()">Close</button>
</div>

<div id="contact" class="section">
  <h2>Contact Us</h2>
  <p>Message us on Facebook page or visit us 📍</p>
  <button class="close" onclick="closeAll()">Close</button>
</div>

<div id="hours" class="section">
  <h2>Working Hours</h2>
  <p>From 8 AM to 1:30 AM</p>
  <button class="close" onclick="closeAll()">Close</button>
</div>

<script>
function show(id) {
  let sections = document.querySelectorAll(".section");
  sections.forEach(sec => sec.classList.remove("active"));

  document.getElementById(id).classList.add("active");
}

function closeAll() {
  let sections = document.querySelectorAll(".section");
  sections.forEach(sec => sec.classList.remove("active"));
}
</script>

</body>
</html>
