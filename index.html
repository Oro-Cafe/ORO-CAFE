<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORO Cafe</title>
    <style>
        body { margin: 0; background: #000; font-family: sans-serif; display: flex; justify-content: center; }
        .wrapper { position: relative; width: 100%; max-width: 500px; }
        .main-img { width: 100%; display: block; }
        .btn-link { position: absolute; cursor: pointer; opacity: 0; z-index: 10; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #d4af37; color: #000; padding: 25px; border-radius: 15px; width: 80%; max-height: 80%; overflow-y: auto; text-align: center; }
        .close-btn { margin-top: 15px; padding: 10px 25px; background: #000; color: #d4af37; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="wrapper">
    <img src="cafe.jpg.png" alt="ORO Cafe" class="main-img">
    
    <a href="https://oro-cafe.github.io/ORO-Caf-/" target="_blank" class="btn-link" style="top: 22%; left: 10%; width: 35%; height: 12%;"></a>
    
    <a onclick="show('engagement')" class="btn-link" style="top: 22%; left: 55%; width: 35%; height: 12%;"></a>
    <a onclick="show('birthday')" class="btn-link" style="top: 40%; left: 10%; width: 80%; height: 12%;"></a>
    <a onclick="show('students')" class="btn-link" style="top: 60%; left: 10%; width: 35%; height: 12%;"></a>
    <a onclick="show('times')" class="btn-link" style="top: 60%; left: 55%; width: 35%; height: 12%;"></a>

    <a href="https://www.facebook.com/share/18qc1vY1iN/" target="_blank" class="btn-link" style="top: 89%; left: 24%; width: 9%; height: 7%;"></a>
    <a href="https://www.instagram.com/oro_cafee01" target="_blank" class="btn-link" style="top: 89%; left: 38%; width: 9%; height: 7%;"></a>
    <a href="https://www.tiktok.com/@orocafe01" target="_blank" class="btn-link" style="top: 89%; left: 52%; width: 9%; height: 7%;"></a>
</div>

<div id="modal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h2 id="modal-title"></h2>
        <div id="modal-body" style="text-align: right; white-space: pre-line; line-height: 1.6;"></div>
        <button class="close-btn" onclick="closeModal()">إغلاق</button>
    </div>
</div>

<script>
    const content = {
        engagement: { title: "عروض الخطوبة", body: "• عرض 3499: قاعة مكيفة + ساوند سيستم.\n• عرض 5500: قاعة + ساوند + ديكور + كوشة.\n• الفضي 6900: باكدج كامل + 70 كانز.\n• الذهبي 7880: باكدج كامل + 70 علبة ضيافة.\n• VIP 9280: باكدج كامل + 70 جاتوه و 70 كانز." },
        birthday: { title: "أعياد الميلاد", body: "• أقل من 5 أفراد: 100ج.\n• 5-10 أفراد: 200ج.\n• 10-20 فرد: 350ج.\n• 20 فرد فأكثر: 50ج للفرد + خصم 10% على المنيو." },
        students: { title: "باكدج الطلاب", body: "• ساعة بـ 20ج | ساعتين بـ 35ج.\n• خصم 15% على المشروبات والديزرت.\n• الرابع مجاناً!" },
        times: { title: "مواعيدنا", body: "• يومياً: 8 ص - 1:30 ص.\n• الجمعة: 12 ظهراً - 1:30 ص." }
    };
    function show(id) {
        document.getElementById('modal-title').innerText = content[id].title;
        document.getElementById('modal-body').innerText = content[id].body;
        document.getElementById('modal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }
</script>

</body>
</html>
