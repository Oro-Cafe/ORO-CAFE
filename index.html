<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORO Cafe</title>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background-color: #000; color: #fff; text-align: center; }
        .wrapper { max-width: 500px; margin: 0 auto; position: relative; }
        img { width: 100%; display: block; }
        .btn { position: absolute; background: transparent; border: none; cursor: pointer; z-index: 10; }
        .menu-btn { top: 21%; left: 5%; width: 42%; height: 21%; }
        .wedding-btn { top: 21%; right: 5%; width: 42%; height: 21%; }
        .birthday-btn { top: 44%; left: 5%; width: 90%; height: 17%; }
        .student-btn { top: 67%; left: 5%; width: 42%; height: 17%; }
        .time-btn { top: 67%; right: 5%; width: 42%; height: 17%; }
        
        #details { 
            margin: 20px; padding: 25px; background: #1a1a1a; 
            border: 2px solid #c5a059; border-radius: 15px; 
            text-align: right; display: none; line-height: 2; font-size: 18px;
        }
        h2 { color: #c5a059; text-align: center; }
        b { color: #c5a059; }
    </style>
</head>
<body>
    <div class="wrapper">
        <img src="welcome-bg.jpg.png" alt="ORO Cafe">
        <a href="https://oro-cafe.github.io/ORO-CAFE/" class="btn menu-btn"></a>
        <button class="btn wedding-btn" onclick="show('wedding')"></button>
        <button class="btn birthday-btn" onclick="show('birthday')"></button>
        <button class="btn student-btn" onclick="show('student')"></button>
        <button class="btn time-btn" onclick="show('time')"></button>
    </div>
    
    <div id="details">
        <h2 id="title"></h2>
        <div id="content"></div>
    </div>

    <script>
        function show(type) {
            const d = document.getElementById('details');
            const t = document.getElementById('title');
            const c = document.getElementById('content');
            d.style.display = 'block';
            
            if(type === 'wedding') {
                t.innerText = "⭐ عروض الخطوبة وكتب الكتاب ⭐";
                c.innerHTML = "القاعة مكيفة بالكامل (الدور الثاني) - تسع 80 فرد.<br>• <b>العرض الأول:</b> 3499 ج (شامل المكان + الساوند سيستم).<br>• <b>العرض الثاني:</b> 5500 ج (شامل المكان + الساوند سيستم + الديكور والكوشة).<br>• <b>العرض الفضي:</b> 6900 ج (شامل المكان + الساوند سيستم + الديكور والكوشة + 70 كانز).<br>• <b>العرض الذهبي:</b> 7880 ج (شامل المكان + الساوند سيستم + الديكور والكوشة + 70 علبة جاتوه مشكل).<br>• <b>عرض الـ VIP:</b> 9280 ج (شامل المكان + الساوند سيستم + الديكور والكوشة + 70 جاتوه مشكل + 70 كانز).<br><br>🎁 <b>عرض لفترة محدودة:</b> فوتوسيشن مجاني في الحديقة.<br>💡 <b>رسوم سيرفس (في حال التقديم فقط):</b> 499 ج.";
            } else if(type === 'birthday') {
                t.innerText = "✨ أعياد الميلاد والسبوع ✨";
                c.innerHTML = "أهلاً بحضرتك يافندم 💛<br>متاح مكانين للاحتفال (الدور الثاني أو الحديقة الأمامية) 🔥<br><br>• <b>أقل من 5 أفراد:</b> 100 ج خدمة + الطلب من المنيو.<br>• <b>من 5 إلى 10 أفراد:</b> 200 ج خدمة + الطلب من المنيو.<br>• <b>من 10 إلى 20 فرد:</b> 350 ج خدمة + الطلب من المنيو.<br>• <b>20 فرد فأكثر:</b> 50 ج للفرد (لا يشترط الطلب)، مع خصم 10% على المنيو.<br><br>✔️ السعر شامل المكان والساوند سيستم.";
            } else if(type === 'student') {
                t.innerText = "🎓 باكدج الطلاب والمذاكرة 🎓";
                c.innerHTML = "أهلاً بطلابنا المبدعين 💛<br>مكان هادئ، واي فاي قوي، ومشروبات تروق المزاج.<br>اسألوا عن العروض الخاصة للجروبات والاشتراكات الشهرية!";
            } else if(type === 'time') {
                t.innerText = "⏰ مواعيد العمل ⏰";
                c.innerHTML = "نحن في خدمتكم طوال أيام الأسبوع:<br>من الساعة <b>10:00 صباحاً</b> وحتى الساعة <b>2:00 بعد منتصف الليل</b>.<br>نتشرف بزيارتكم في أي وقت! 💛";
            }
            d.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
