<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORO Cafe</title>
    <style>
        body { margin: 0; padding: 0; background: #000; direction: rtl; }
        .wrapper { max-width: 500px; margin: 0 auto; }
        img { width: 100%; display: block; }
        .btn { position: absolute; background: transparent; border: none; cursor: pointer; }
        /* أماكن الأزرار بناءً على الصورة */
        .wedding-btn { top: 21%; right: 5%; width: 42%; height: 21%; }
        .birthday-btn { top: 44%; left: 5%; width: 90%; height: 17%; }
        .details { color: #fff; padding: 20px; text-align: right; display: none; border: 1px solid #c5a059; }
    </style>
</head>
<body>
    <div class="wrapper" style="position: relative;">
        <img src="welcome-bg.jpg.png" alt="ORO Cafe">
        <button class="btn wedding-btn" onclick="show('wedding')"></button>
        <button class="btn birthday-btn" onclick="show('birthday')"></button>
    </div>
    <div id="details" class="details"></div>

    <script>
        function show(type) {
            const d = document.getElementById('details');
            d.style.display = 'block';
            d.innerHTML = (type === 'wedding') 
                ? "<h2>عروض الخطوبة</h2><p>• العرض الأول: 3499 ج<br>• العرض الثاني: 5500 ج<br>• الفضي: 6900 ج<br>• الذهبي: 7880 ج<br>• VIP: 9280 ج</p>"
                : "<h2>عروض أعياد الميلاد</h2><p>• أقل من 5 أفراد: 100 ج<br>• 5-10 أفراد: 200 ج<br>• 10-20 فرد: 350 ج<br>• 20+ فرد: 50 ج للفرد</p>";
        }
    </script>
</body>
</html>
